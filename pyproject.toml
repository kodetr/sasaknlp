[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sasaknlp"
version = "0.1.2"
description = "An open-source NLP and morphological processing toolkit for the low-resource Sasak language."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "kodetr" }
]
keywords = [
    "nlp",
    "sasak",
    "morphology",
    "stemmer",
    "low-resource-language",
    "computational-linguistics",
    "indonesian-languages"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic"
]
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://kodetr.com"
Repository = "https://github.com/kodetr/sasaknlp"
Documentation = "https://github.com/kodetr/sasaknlp#readme"
"Demo Web" = "https://huggingface.co/spaces/kodetr/sasaknlp-demo"
"Dataset" = "https://huggingface.co/datasets/kodetr/sasak-benchmark-100k"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0"
]

[project.scripts]
sasaknlp = "sasaknlp.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sasaknlp = [
    "lexicon/data/*.json",
    "morphology/rules/*.json",
    "dialect/rules/*.json",
    "stopwords/data/*.json"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
